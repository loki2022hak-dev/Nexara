version: '3.8'

services:
  bot:
    build: .
    restart: always
    env_file: .env
    volumes:
      - ./guardian.db:/app/guardian.db
      - ./temp:/app/temp
    depends_on:
      - ollama

  web:
    build: .
    restart: always
    ports:
      - "8000:8000"
    command: uvicorn web_panel:app --host 0.0.0.0 --port 8000
    env_file: .env
    depends_on:
      - bot

  ollama:
    image: ollama/ollama
    restart: always
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
